# =========================================================
# NGINX API Gateway - GradFlow Users Microservices
# =========================================================
# -------------------------
# Upstream services
# -------------------------
upstream users_create {
    server 127.0.0.1:3001;
}

upstream users_delete {
    server 127.0.0.1:3002;
}

upstream users_list {
    server 127.0.0.1:3003;
}

upstream users_search {
    server 127.0.0.1:3004;
}

upstream users_update {
    server 127.0.0.1:3005;
}

# -------------------------
# Main server
# -------------------------
server {
    listen 80;
    server_name _;

    # -------------------------
    # Global proxy headers
    # -------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =====================================================
    # USERS CREATE
    # =====================================================
    location = /api/users/create {
        proxy_pass http://users_create/api/users;
    }

    location = /api/users/create/api-docs/ {
        proxy_pass http://users_create/api-docs/;
    }

    # =====================================================
    # USERS DELETE
    # =====================================================
    location ~ ^/api/users/([^/]+)/delete$ {
        proxy_pass http://users_delete/api/users/$1;
    }

    location = /api/users/delete/api-docs/ {
        proxy_pass http://users_delete/api-docs/;
    }

    # =====================================================
    # USERS LIST
    # =====================================================
    location = /api/users {
        proxy_pass http://users_list/api/users;
    }

    location = /api/users/api-docs/ {
        proxy_pass http://users_list/api-docs/;
    }

    # =====================================================
    # USERS SEARCH
    # =====================================================
    location = /api/users/search {
        proxy_pass http://users_search/api/users/search;
    }

    location = /api/users/search/api-docs/ {
        proxy_pass http://users_search/api-docs/;
    }

    # =====================================================
    # USERS UPDATE
    # =====================================================
    location ~ ^/api/users/([^/]+)/update$ {
        proxy_pass http://users_update/api/users/$1;
    }

    location = /api/users/update/api-docs/ {
        proxy_pass http://users_update/api-docs/;
    }

    # -------------------------
    # Default
    # -------------------------
    location / {
        return 404;
    }
}
