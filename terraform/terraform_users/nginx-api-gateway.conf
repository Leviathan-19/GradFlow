# =========================================================
# NGINX API Gateway - GradFlow Users Microservices
# Runs behind AWS ALB (HTTP :80)
# =========================================================

# -------------------------
# Upstream services (LOCAL)
# -------------------------
upstream users_create {
    server 127.0.0.1:3001;
}

upstream users_delete {
    server 127.0.0.1:3002;
}

upstream users_list {
    server 127.0.0.1:3003;
}

upstream users_search {
    server 127.0.0.1:3004;
}

upstream users_update {
    server 127.0.0.1:3005;
}

# -------------------------
# Main server
# -------------------------
server {
    listen 80;
    server_name _;

    # -------------------------
    # Global proxy headers
    # -------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # =====================================================
    # USERS CREATE
    # =====================================================

    # Swagger
    location /users/create/api-docs/ {
        proxy_pass http://users_create/api-docs/;
    }

    # POST create user
    location = /users/create {
        proxy_pass http://users_create/api/users;
    }

    # =====================================================
    # USERS DELETE
    # =====================================================
    location /users/delete/ {
        proxy_pass http://users_delete/api/users/;
    }

    # =====================================================
    # USERS LIST
    # =====================================================
    location = /users/list {
        proxy_pass http://users_list/api/users;
    }

    # =====================================================
    # USERS SEARCH
    # =====================================================
    location = /users/search {
        proxy_pass http://users_search/api/users/search;
    }

    # =====================================================
    # USERS UPDATE
    # =====================================================
    location /users/update/ {
        proxy_pass http://users_update/api/users/;
    }

    # -------------------------
    # Default
    # -------------------------
    location / {
        return 404;
    }

    # -------------------------
    # Errors
    # -------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
