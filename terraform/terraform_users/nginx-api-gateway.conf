# NGINX Configuration for GradFlow API Gateway
# This file is generated by user-data-template.sh
# Location: /etc/nginx/conf.d/api-gateway.conf

# Upstream definitions for backend services
upstream users_create {
    server 127.0.0.1:3001;
}

upstream users_delete {
    server 127.0.0.1:3002;
}

upstream users_list {
    server 127.0.0.1:3003;
}

upstream users_search {
    server 127.0.0.1:3004;
}

upstream users_update {
    server 127.0.0.1:3005;
}

upstream api_gateway {
    server 127.0.0.1:3000;
}

# Main server block
server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Headers for proper proxy behavior
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Health check endpoint (forward to API Gateway)
    location /api/health {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Logs endpoint (forward to API Gateway)
    location /api/logs {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Auth endpoints (forward to API Gateway)
    location /api/auth {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # File service endpoints (forward to API Gateway)
    location /api/files {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Users endpoints - route directly to specific services
    location /api/users/create {
        proxy_pass http://users_create/api/users;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_method POST;
    }

    location /api/users/delete {
        # This will be handled by DELETE /api/users/:id
        proxy_pass http://users_delete;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/users/list {
        proxy_pass http://users_list/api/users;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/users/search {
        proxy_pass http://users_search/api/users/search;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/users/update {
        # This will be handled by PUT /api/users/:id
        proxy_pass http://users_update;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Generic users routes (forward to API Gateway for proper routing)
    location /api/users {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Default route - forward to API Gateway
    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
