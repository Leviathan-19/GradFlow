name: Build & Push API Gateway

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/api-gateway/**"
      - ".github/workflows/api-gateway.yml"
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build service regardless of changes (for first-time setup)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-api-gateway:qa \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-api-gateway:latest \
            ./apps/backend/api-gateway

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-api-gateway:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-api-gateway:latest