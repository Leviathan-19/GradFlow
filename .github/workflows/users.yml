name: Build & Push Users Domain

on:
  push:
    branches:
      - Qa
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env and copy to user services
        run: |
         echo "***" > .env
          cp .env apps/backend/users/users_create/.env
          cp .env apps/backend/users/users_delete/.env
          cp .env apps/backend/users/users_list/.env
          cp .env apps/backend/users/users_search/.env
          cp .env apps/backend/users/users_update/.env

      - name: Build all services with docker-compose
        working-directory: ./apps/backend/users
        run: |
          docker compose build

      - name: Tag and Push users-create
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "users.*users-create" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-create:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-create:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-create:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-create:latest

      - name: Tag and Push users-delete
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "users.*users-delete" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-delete:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-delete:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-delete:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-delete:latest

      - name: Tag and Push users-list
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "users.*users-list" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-list:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-list:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-list:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-list:latest

      - name: Tag and Push users-search
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "users.*users-search" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-search:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-search:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-search:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-search:latest

      - name: Tag and Push users-update
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "users.*users-update" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-update:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-update:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-update:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-users-update:latest

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "All users services built and pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- users-create" >> $GITHUB_STEP_SUMMARY
          echo "- users-delete" >> $GITHUB_STEP_SUMMARY
          echo "- users-list" >> $GITHUB_STEP_SUMMARY
          echo "- users-search" >> $GITHUB_STEP_SUMMARY
          echo "- users-update" >> $GITHUB_STEP_SUMMARY
