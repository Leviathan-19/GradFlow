name: Build & Push File Service Domain

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build all services with docker-compose
        working-directory: ./apps/backend/file-service
        run: |
          docker compose build

      - name: Tag and Push files-init
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "(file-service|fileservice).*files-init" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-init:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-init:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-init:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-init:latest

      - name: Tag and Push files-update
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "(file-service|fileservice).*files-update" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-update:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-update:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-update:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-update:latest

      - name: Tag and Push files-upload
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "(file-service|fileservice).*files-upload" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-upload:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-upload:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-upload:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-upload:latest

      - name: Tag and Push files-list
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "(file-service|fileservice).*files-list" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-list:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-list:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-list:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-list:latest

      - name: Tag and Push files-download
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "(file-service|fileservice).*files-download" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-download:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-download:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-download:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-files-download:latest

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "All file-service services built and pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- files-init" >> $GITHUB_STEP_SUMMARY
          echo "- files-update" >> $GITHUB_STEP_SUMMARY
          echo "- files-upload" >> $GITHUB_STEP_SUMMARY
          echo "- files-list" >> $GITHUB_STEP_SUMMARY
          echo "- files-download" >> $GITHUB_STEP_SUMMARY
