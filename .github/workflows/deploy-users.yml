name: Deploy Users Domain to EC2

on:
  workflow_run:
    workflows: ["Build & Push Users Domain"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: 'Terraform directory (e.g., terraform_users)'
        required: true
        default: 'terraform_users'
      deployment_method:
        description: 'Deployment method (ssm, ssh, or instance-refresh)'
        required: false
        default: 'ssm'
        type: choice
        options:
          - ssm
          - ssh
          - instance-refresh

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Terraform outputs
        id: terraform-outputs
        run: |
          cd ${{ github.event.inputs.terraform_dir || 'terraform/terraform_users' }}
          
          # Get Load Balancer DNS
          LB_DNS=$(terraform output -raw loadbalancer_dns 2>/dev/null || echo "")
          echo "loadbalancer_dns=$LB_DNS" >> $GITHUB_OUTPUT
          
          # Get ASG name
          ASG_NAME=$(terraform output -raw asg_name 2>/dev/null || echo "")
          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT
          
          # Get instance IDs from ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[*].InstanceId' \
            --output text 2>/dev/null || echo "")
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          
          # Get instance IPs for SSH fallback
          if [ -n "$INSTANCE_IDS" ]; then
            INSTANCE_IPS=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_IDS \
              --query 'Reservations[*].Instances[*].[InstanceId,PublicIpAddress]' \
              --output text 2>/dev/null | awk '{print $2}' | grep -v 'None' | head -1 || echo "")
            echo "instance_ip=$INSTANCE_IPS" >> $GITHUB_OUTPUT
          fi

      # Option 1: Deploy via SSM (Recommended for Auto Scaling Groups)
      - name: Deploy to EC2 instances via SSM
        if: |
          (github.event.inputs.deployment_method == 'ssm' || github.event.inputs.deployment_method == '') &&
          steps.terraform-outputs.outputs.instance_ids != ''
        run: |
          INSTANCE_IDS="${{ steps.terraform-outputs.outputs.instance_ids }}"
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
          
          # Services to deploy
          SERVICES=("users-create" "users-delete" "users-list" "users-search" "users-update")
          
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying to instance: $INSTANCE_ID"
            
            # Wait for SSM agent to be ready (if instance just started)
            echo "Waiting for SSM agent to be ready..."
            aws ssm wait instance-in-service --instance-ids "$INSTANCE_ID" || echo "SSM agent may not be ready, continuing..."
            
            # Login to Docker Hub first
            LOGIN_SCRIPT=$(cat <<'LOGINEOF'
#!/bin/bash
set -e
echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
echo "Docker Hub login successful"
LOGINEOF
)
            
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME'; export DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN'; $LOGIN_SCRIPT]" \
              --comment "Docker Hub login" \
              --output text > /dev/null || echo "Warning: Docker login failed"
            
            for SERVICE in "${SERVICES[@]}"; do
              IMAGE_NAME="${DOCKERHUB_USERNAME}/gradflow-${SERVICE}:qa"
              
              # Create deployment script
              DEPLOY_SCRIPT=$(cat <<DEPLOYEOF
#!/bin/bash
set -e

SERVICE_NAME="${SERVICE}"
IMAGE_NAME="${IMAGE_NAME}"

echo "Deploying \$SERVICE_NAME..."

# Stop and remove existing container
docker stop "\$SERVICE_NAME" 2>/dev/null || true
docker rm "\$SERVICE_NAME" 2>/dev/null || true

# Pull latest image
docker pull "\$IMAGE_NAME" || {
  echo "Warning: Failed to pull \$IMAGE_NAME"
  exit 1
}

# Get port based on service
case "\$SERVICE_NAME" in
  "users-create") PORT=3001 ;;
  "users-delete") PORT=3002 ;;
  "users-list") PORT=3003 ;;
  "users-search") PORT=3004 ;;
  "users-update") PORT=3005 ;;
  *) PORT=3000 ;;
esac

# Run container
docker run -d \
  --name "\$SERVICE_NAME" \
  --restart always \
  -p "\$PORT:\$PORT" \
  --env-file /home/ubuntu/.env \
  "\$IMAGE_NAME"

echo "Deployed \$SERVICE_NAME successfully on port \$PORT"
docker ps --filter "name=\$SERVICE_NAME" --format "{{.Names}}: {{.Status}}"
DEPLOYEOF
)
              
              # Send command via SSM
              COMMAND_ID=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[$DEPLOY_SCRIPT]" \
                --comment "Deploy $SERVICE to $INSTANCE_ID" \
                --output text \
                --query 'Command.CommandId' || echo "")
              
              if [ -n "$COMMAND_ID" ]; then
                echo "Command sent: $COMMAND_ID"
                # Wait for command to complete
                aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || echo "Command may still be running"
              fi
            done
          done

      # Option 2: Deploy via SSH (Fallback - requires static IP or Elastic IP)
      - name: Deploy via SSH (fallback)
        if: |
          github.event.inputs.deployment_method == 'ssh' &&
          steps.terraform-outputs.outputs.instance_ip != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.terraform-outputs.outputs.instance_ip || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            
            # Login to Docker Hub
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            # Services to deploy
            SERVICES=("users-create" "users-delete" "users-list" "users-search" "users-update")
            
            for SERVICE in "${SERVICES[@]}"; do
              IMAGE_NAME="${DOCKERHUB_USERNAME}/gradflow-${SERVICE}:qa"
              
              echo "Deploying $SERVICE..."
              
              # Stop and remove existing container
              docker stop "$SERVICE" 2>/dev/null || true
              docker rm "$SERVICE" 2>/dev/null || true
              
              # Pull latest image
              docker pull "$IMAGE_NAME" || {
                echo "Warning: Failed to pull $IMAGE_NAME"
                continue
              }
              
              # Get port based on service
              case "$SERVICE" in
                "users-create") PORT=3001 ;;
                "users-delete") PORT=3002 ;;
                "users-list") PORT=3003 ;;
                "users-search") PORT=3004 ;;
                "users-update") PORT=3005 ;;
                *) PORT=3000 ;;
              esac
              
              # Run container
              docker run -d \
                --name "$SERVICE" \
                --restart always \
                -p "$PORT:$PORT" \
                --env-file /home/ubuntu/.env \
                "$IMAGE_NAME"
              
              echo "Deployed $SERVICE successfully on port $PORT"
            done
            
            # Show running containers
            docker ps --filter "name=users-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      # Option 3: Instance Refresh (Zero-downtime deployment)
      - name: Trigger Instance Refresh
        if: github.event.inputs.deployment_method == 'instance-refresh'
        run: |
          ASG_NAME="${{ steps.terraform-outputs.outputs.asg_name }}"
          
          echo "Triggering instance refresh for ASG: $ASG_NAME"
          
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=180 \
            --output json
          
          echo "Instance refresh started. New instances will pull latest Docker images automatically."
