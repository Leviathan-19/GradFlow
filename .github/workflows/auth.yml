name: Build & Push Auth Domain

on:
  push:
    branches:
      - QA
    paths:
      - "apps/backend/auth/**"

jobs:
  build-and-push-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # AUTH LOGIN
      - name: Build & Push auth-login
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:qa \
            ./apps/backend/auth/auth_login
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:qa

      # AUTH ROL
      - name: Build & Push auth-rol
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:qa \
            ./apps/backend/auth/auth_rol
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:qa

      # AUTH ME
      - name: Build & Push auth-me
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:qa \
            ./apps/backend/auth/auth_me
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:qa
