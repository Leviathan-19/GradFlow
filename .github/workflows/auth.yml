name: Build & Push Auth Domain

on:
  push:
    branches:
      - QA
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build all services with docker-compose
        working-directory: ./apps/backend/auth
        run: |
          docker compose build

      - name: Tag and Push auth-login
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "auth.*auth_login" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-login:latest

      - name: Tag and Push auth-rol
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "auth.*auth_rol" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-rol:latest

      - name: Tag and Push auth-me
        run: |
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "auth.*auth_me" | head -1)
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:qa
          docker tag "$IMAGE" ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:qa
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gradflow-auth-me:latest

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo " All auth services built and pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- auth-login" >> $GITHUB_STEP_SUMMARY
          echo "- auth-rol" >> $GITHUB_STEP_SUMMARY
          echo "- auth-me" >> $GITHUB_STEP_SUMMARY
